<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sử dụng bộ chọn CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sử dụng ID cho phần tử duy nhất -->
    <h1 id="tieu-de-chinh">Trang web của tôi</h1>

    <p>Xin chào, mình là Khánh - sinh viên An toàn thông tin tại ICTU và là người sáng lập không gian đồ uống Khánh Bán Bơ Chill.</p>

    <!-- Sử dụng Class cho nhóm phần tử -->
    <ul class="danh-sach-so-thich">
        <li class="muc-xanh-la">Pha chế sinh tố bơ và nước dừa tươi</li>
        <li class="muc-xanh-duong">Lập trình web với ASP.NET Core MVC</li>
        <li class="muc-cam">Tìm hiểu các loại trà đặc sản (Shan Tuyết, trà nhài)</li>
    </ul>

    <!-- Nút bấm để thực hành pseudo-class -->
    <button class="nut-bam">Nhấn vào đây</button>
</body>
</html>
