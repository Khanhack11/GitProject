<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Thành Viên - Khánh Bán Bơ Chill</title>
    <!-- Nhúng CSS của Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- 1. NAVBAR: Thanh điều hướng phía trên -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🥑 Khánh Bán Bơ Chill</a>
            <div class="ms-auto">
                <a href="#" class="btn btn-outline-light btn-sm">Đăng Nhập</a>
            </div>
        </div>
    </nav>

    <!-- 2. MAIN CONTAINER: Chứa Form đăng ký căn giữa màn hình -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                
                <!-- Khẻ Card bọc toàn bộ form cho gọn gàng, chuyên nghiệp -->
                <div class="card shadow border-0 p-4 p-md-5 rounded-4 bg-white">
                    
                    <!-- Tiêu đề form -->
                    <div class="text-center mb-4">
                        <h2 class="text-success fw-bold">Tạo Tài Khoản</h2>
                        <p class="text-muted small">Đăng ký thành viên để tích điểm và nhận ưu đãi độc quyền</p>
                    </div>

                    <!-- Form đăng ký -->
                    <form>
                        <!-- Trường: Họ và tên -->
                        <div class="mb-3">
                            <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên của bạn" required>
                        </div>

                        <!-- Trường: Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>

                        <!-- Trường: Mật khẩu -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" placeholder="Tối thiểu 6 ký tự" required>
                        </div>

                        <!-- Trường: Xác nhận mật khẩu -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                        </div>

                        <!-- Trường: Giới tính (Radio button) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Giới tính</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked>
                                <label class="form-check-label" for="male">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                                <label class="form-check-label" for="female">Nữ</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="other" value="other">
                                <label class="form-check-label" for="other">Khác</label>
                            </div>
                        </div>

                        <!-- Trường: Sở thích (Checkbox) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Sở thích uống đồ uống</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="avocado" id="hobby1">
                                <label class="form-check-label" for="hobby1">Sinh tố bơ</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="coconut" id="hobby2">
                                <label class="form-check-label" for="hobby2">Nước dừa tươi</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="tea" id="hobby3">
                                <label class="form-check-label" for="hobby3">Trà Shan Tuyết</label>
                            </div>
                        </div>

                        <!-- Trường: Quốc gia (Dropdown Select) -->
                        <div class="mb-4">
                            <label for="country" class="form-label fw-semibold">Quốc gia</label>
                            <select class="form-select" id="country">
                                <option selected>Chọn quốc gia...</option>
                                <option value="vn">Việt Nam</option>
                                <option value="us">United States</option>
                                <option value="jp">Japan</option>
                                <option value="kr">Korea</option>
                            </select>
                        </div>

                        <!-- Nút Submit (Đổi thành màu xanh lá .btn-success cho hợp thương hiệu) -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">Đăng Ký Ngay</button>
                        </div>

                        <!-- Chú thích phụ dưới cùng -->
                        <div class="text-center mt-3">
                            <p class="text-muted small mb-0">Đã có tài khoản? <a href="#" class="text-success text-decoration-none fw-semibold">Đăng nhập tại đây</a></p>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <!-- 3. FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 Khánh Bán Bơ Chill. All rights reserved.</p>
        </div>
    </footer>

    <!-- Nhúng JavaScript của Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
