<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Danh sách sản phẩm</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #dddddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>
    
    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Sinh tố bơ</td>
            <td>25.000 VNĐ</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Nước dừa tươi</td>
            <td>20.000 VNĐ</td>
            <td>15</td>
        </tr>
        <tr>
            <td>Trà Shan Tuyết Hà Giang</td>
            <td>35.000 VNĐ</td>
            <td>5</td>
        </tr>
        <tr>
            <td>Trà nhài</td>
            <td>15.000 VNĐ</td>
            <td>20</td>
        </tr>
    </table>
</body>
</html>
