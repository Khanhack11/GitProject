<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form đăng ký người dùng</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-box { 
            border: 1px solid #ccc; 
            padding: 20px; 
            width: 350px; 
            background-color: #f9f9f9; 
            border-radius: 5px; 
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"] { 
            width: 90%; 
            padding: 8px; 
            border: 1px solid #aaa; 
            border-radius: 4px; 
        }
        .btn-submit { 
            background-color: #4CAF50; 
            color: white; 
            padding: 10px 15px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>Đăng ký người dùng</h2>
        
        <!-- Cấu hình đúng action và method POST theo yêu cầu -->
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            
            <div class="form-group">
                <label>Họ và tên:</label>
                <!-- Tên trường là "name" -->
                <input type="text" name="name" placeholder="Nhập họ và tên..." required>
            </div>
            
            <div class="form-group">
                <label>Email:</label>
                <!-- Tên trường là "email" -->
                <input type="email" name="email" placeholder="Nhập email..." required>
            </div>
            
            <div class="form-group">
                <label>Số điện thoại:</label>
                <!-- Tên trường là "phone" -->
                <input type="text" name="phone" placeholder="Nhập số điện thoại..." required>
            </div>
            
            <div class="form-group">
                <label>Giới tính:</label>
                <!-- Tên trường là "gender" -->
                <input type="radio" name="gender" value="Nam" checked> Nam
                <input type="radio" name="gender" value="Nữ"> Nữ
            </div>
            
            <div class="form-group">
                <input type="submit" class="btn-submit" value="Đăng ký">
            </div>
            
        </form>
    </div>

</body>
</html>
