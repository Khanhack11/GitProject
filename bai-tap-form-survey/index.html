<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Market Research Survey</title>
    <style>
        body { 
            font-family: "Lucida Grande", Tahoma, Arial, sans-serif; 
            background-color: #e9e9e9; 
            padding: 20px; 
        }
        .survey-container { 
            background-color: #fff; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 30px; 
            border-top: 5px solid #ff4500; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        h2 { margin-top: 0; color: #333; }
        .description { font-size: 14px; color: #666; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #222; }
        .sub-label { font-size: 12px; color: #888; font-weight: normal; display: block; margin-top: 4px; }
        .inline-group { display: inline-block; width: 48%; }
        input[type="text"], input[type="email"], select, textarea { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 3px; 
            box-sizing: border-box; 
        }
        .radio-group, .checkbox-group { font-size: 14px; margin-bottom: 8px; color: #444; }
        .btn-submit { 
            background-color: #ff4500; 
            color: #fff; 
            padding: 10px 20px; 
            border: none; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 3px; 
            font-weight: bold;
        }
        .btn-submit:hover { background-color: #e03e00; }
    </style>
</head>
<body>

    <div class="survey-container">
        <h2>Market Research Survey</h2>
        <div class="description">Please take a few moments to complete this satisfaction survey.</div>
        
        <form action="#" method="POST">
            <!-- Nhập Tên -->
            <div class="form-group">
                <label>Name</label>
                <div class="inline-group" style="margin-right: 2%;">
                    <input type="text" name="first_name" required>
                    <span class="sub-label">First</span>
                </div>
                <div class="inline-group">
                    <input type="text" name="last_name" required>
                    <span class="sub-label">Last</span>
                </div>
            </div>
            
            <!-- Nhập Email -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            
            <!-- Chọn độ tuổi (Thẻ select) -->
            <div class="form-group">
                <label>Your Age Range</label>
                <select name="age">
                    <option value="">-- Please Select --</option>
                    <option value="18-24">18 - 24</option>
                    <option value="25-34">25 - 34</option>
                    <option value="35-50">35 - 50</option>
                    <option value="50+">50+</option>
                </select>
            </div>
            
            <!-- Chọn nhiều đáp án (Thẻ checkbox) -->
            <div class="form-group">
                <label>Which products would you like to see more of?</label>
                <div class="checkbox-group"><input type="checkbox" name="product" value="Sinh to bo"> Sinh tố bơ</div>
                <div class="checkbox-group"><input type="checkbox" name="product" value="Nuoc dua"> Nước dừa</div>
                <div class="checkbox-group"><input type="checkbox" name="product" value="Tra Shan Tuyet"> Trà Shan Tuyết</div>
                <div class="checkbox-group"><input type="checkbox" name="product" value="Tra nhai"> Trà nhài</div>
            </div>

            <!-- Chọn 1 đáp án (Thẻ radio) -->
            <div class="form-group">
                <label>How would you rate our service?</label>
                <div class="radio-group"><input type="radio" name="rating" value="Excellent"> Excellent</div>
                <div class="radio-group"><input type="radio" name="rating" value="Good"> Good</div>
                <div class="radio-group"><input type="radio" name="rating" value="Fair"> Fair</div>
                <div class="radio-group"><input type="radio" name="rating" value="Poor"> Poor</div>
            </div>
            
            <!-- Ô nhập chữ rộng (Thẻ textarea) -->
            <div class="form-group">
                <label>Additional Comments or Suggestions</label>
                <textarea name="comments" rows="4"></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Submit</button>
        </form>
    </div>

</body>
</html>
