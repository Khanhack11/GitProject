<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form Tìm kiếm</title>
</head>
<body>
    <h1>Trang Tìm Kiếm</h1>

    <!-- Form tìm kiếm với Google -->
    <h2>Tìm kiếm với Google</h2>
    <form action="https://www.google.com.vn/search" method="GET"> 
        <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm Google..."/>
        <input type="submit" value="Tìm kiếm Google"/>
    </form>

    <hr> <!-- Thẻ kẻ một đường ngang phân cách -->

    <!-- Form tìm kiếm với Bing (Trả lời câu hỏi mở rộng của bài) -->
    <h2>Tìm kiếm với Bing</h2>
    <form action="https://www.bing.com/search" method="GET"> 
        <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm Bing..."/>
        <input type="submit" value="Tìm kiếm Bing"/>
    </form>
</body>
</html>
