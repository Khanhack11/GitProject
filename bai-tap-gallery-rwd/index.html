<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Gallery - Khánh Bán Bơ Chill</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 style="text-align:center; margin-top: 20px;">Thư viện ảnh: Khánh Bán Bơ Chill</h2>
    <p style="text-align:center; color: #555; margin-bottom: 30px;">Hãy thử thu nhỏ cửa sổ trình duyệt để xem các bức ảnh tự động sắp xếp lại (4 cột ➔ 2 cột ➔ 1 cột).</p>

    <!-- Ảnh 1 -->
    <div class="responsive">
        <div class="gallery">
            <!-- Dùng link ảnh online để bạn không cần tải file về máy -->
            <img src="https://images.unsplash.com/photo-1628557044797-f21a177c37ec?w=500" alt="Sinh tố bơ">
            <div class="desc">Sinh tố bơ béo ngậy</div>
        </div>
    </div>

    <!-- Ảnh 2 -->
    <div class="responsive">
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=500" alt="Nước dừa tươi">
            <div class="desc">Nước dừa tươi thanh mát</div>
        </div>
    </div>

    <!-- Ảnh 3 -->
    <div class="responsive">
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=500" alt="Trà Shan Tuyết">
            <div class="desc">Trà Shan Tuyết cổ thụ</div>
        </div>
    </div>

    <!-- Ảnh 4 -->
    <div class="responsive">
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1597481499750-3e6b22637e12?w=500" alt="Trà nhài">
            <div class="desc">Trà nhài ủ hương thơm lừng</div>
        </div>
    </div>

    <!-- Khối div trống này dùng để clear float, giúp giao diện không bị vỡ -->
    <div class="clearfix"></div>

</body>
</html>
