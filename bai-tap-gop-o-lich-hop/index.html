<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lịch họp công ty</title>
    <style>
        table {
            width: 70%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Lịch họp công ty</h1>
    
    <table>
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>
        <tr>
            <!-- rowspan="2" gộp 2 hàng của cột Ngày lại với nhau -->
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 10:00</td>
            <td>Họp giao ban ban giám đốc</td>
        </tr>
        <tr>
            <td>14:00 - 16:00</td>
            <td>Lên kế hoạch kinh doanh quán Khánh Bán Bơ Chill</td>
        </tr>
        <tr>
            <td>Thứ Ba</td>
            <!-- colspan="2" gộp 2 cột Giờ và Nội dung lại với nhau -->
            <td colspan="2">Sự kiện Team Building toàn công ty (Nghỉ làm việc)</td>
        </tr>
    </table>
</body>
</html>
