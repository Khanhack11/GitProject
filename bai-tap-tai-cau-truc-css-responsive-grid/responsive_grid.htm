<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid - Tái Cấu Trúc Bằng SASS (CodeGym)</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Khối Layout chính (Overlay hiển thị phía trước) -->
  <div class="grid-overlay">
    <div class="gridcontainer">
      
      <!-- Hàng Header: 12 cột (100%) -->
      <div class="gridwrapper gridwrapper--header">
        <div class="gridcontent col-12 gridcontent--header"></div>
      </div>

      <!-- Hàng Thân: Menu trái (3 cột / 25%), 6 cột khoảng trống (50%), Content phải (3 cột / 25%) -->
      <div class="gridwrapper gridwrapper--body">
        
        <!-- Sidebar trái (25%) với 4 menu items -->
        <div class="gridcontent col-3 gridcontent--sidebar-left">
          <div class="menu-item"></div>
          <div class="menu-item"></div>
          <div class="menu-item"></div>
          <div class="menu-item"></div>
        </div>

        <!-- 6 cột ở giữa (6 x 8.33% = 50%) -->
        <div class="gridcontent col-1 gridcontent--empty"></div>
        <div class="gridcontent col-1 gridcontent--empty"></div>
        <div class="gridcontent col-1 gridcontent--empty"></div>
        <div class="gridcontent col-1 gridcontent--empty"></div>
        <div class="gridcontent col-1 gridcontent--empty"></div>
        <div class="gridcontent col-1 gridcontent--empty"></div>

        <!-- Khối bên phải (25%) với content bar -->
        <div class="gridcontent col-3 gridcontent--sidebar-right">
          <div class="content-box"></div>
        </div>

      </div>

      <!-- Hàng Footer: 12 cột (100%) -->
      <div class="gridwrapper gridwrapper--footer">
        <div class="gridcontent col-12 gridcontent--footer"></div>
      </div>

    </div>
  </div>

  <!-- Lưới 12 cột làm mốc hiển thị phía sau (Guide Grid) -->
  <div class="gridcontainer grid-guide">
    <div class="gridwrapper gridwrapper--guide">
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
      <div class="gridcontent col-1"></div>
    </div>
  </div>

  <p class="info-text">Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>

</body>
</html>
