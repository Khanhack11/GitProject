<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bài tập: Tạo form đơn giản</title>
    <!-- Thêm CSS để căn chỉnh, định dạng màu sắc và font chữ theo yêu cầu -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
        }
        .form-box {
            background-color: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin-bottom: 30px;
        }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; font-weight: bold; color: #333; }
        input[type="text"], input[type="email"], select {
            width: 250px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-submit { background-color: #27ae60; }
        .btn-reset { background-color: #e74c3c; }
    </style>
</head>
<body>

    <!-- PHẦN 1: Form thu thập thông tin -->
    <div class="form-box">
        <h2>Phần 1: Thông tin cá nhân</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" name="yourname" placeholder="Nhập họ và tên...">
            </div>
            
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" placeholder="Nhập email...">
            </div>
            
            <div class="form-group">
                <label>Sở thích:</label>
                <input type="checkbox" name="hobby" value="Kinh doanh"> Kinh doanh
                <input type="checkbox" name="hobby" value="Pha chế"> Pha chế
                <input type="checkbox" name="hobby" value="Lập trình"> Lập trình
            </div>
            
            <div class="form-group" style="text-align: center; margin-top: 20px;">
                <input type="submit" class="btn btn-submit" value="Gửi thông tin">
                <input type="reset" class="btn btn-reset" value="Nhập lại">
            </div>
        </form>
    </div>

    <!-- PHẦN 2: Form đăng ký học viên -->
    <div class="form-box">
        <h2>Phần 2: Đăng ký học viên</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" name="fullname" placeholder="Nhập họ và tên...">
            </div>
            
            <div class="form-group">
                <label>Giới tính:</label>
                <input type="radio" name="gender" value="Male"> Nam
                <input type="radio" name="gender" value="Female"> Nữ
            </div>
            
            <div class="form-group">
                <label>Điện thoại:</label>
                <input type="text" name="phone" placeholder="Nhập số điện thoại...">
            </div>
            
            <div class="form-group">
                <label>Khóa học:</label>
                <select name="course">
                    <option value="html_css">HTML & CSS Cơ bản</option>
                    <option value="asp_net">ASP.NET Core MVC</option>
                    <option value="database">Cơ sở dữ liệu (SQL)</option>
                </select>
            </div>
            
            <div class="form-group" style="text-align: center; margin-top: 20px;">
                <input type="submit" class="btn btn-submit" value="Đăng ký">
                <input type="reset" class="btn btn-reset" value="Nhập lại">
            </div>
        </form>
    </div>

</body>
</html>
